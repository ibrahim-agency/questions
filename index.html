<title>The Freelancers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--ink:#1A1916;--linen:#F2ECE2;--fg:var(--ink);--bg:var(--linen)}

html,body{margin:0;height:100%}
